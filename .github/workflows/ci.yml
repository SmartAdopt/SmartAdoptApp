name: CI- Continuous Integration
on:
  push:
    branches: ["develop", "qa", "main", "feature/**", "bugfix/**", "release/**",
               "refactor/**","hotfix/**","chore/**","docs/**","test/**"]
    paths:
      - "backend/**"
      - "frontend/**"
  pull_request:
    branches: ["develop", "qa", "main"]
    paths:
      - "backend/**"
      - "frontend/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-lint:
    name: Backend - Lint & Format (Ruff + Black + mypy)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install Dependencies
        run: |
          pip install ruff black mypy bandit
          pip install -r backend/requirements.txt
      - name: Ruff - linting
        run: ruff check backend/
      - name: Black - Format
        run: black --check backend/
      - name: mypy — Static Type
        run: mypy backend/ --ignore-missing-imports
      - name: Bandit - Security Scan
        run: bandit -r backend/ -ll

  backend-tests:
    name: Backend-Test (pytest)
    runs-on: ubuntu-latest
    needs: [changes,backend-lint]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r backend/requirements.txt
      - name: pytest
        run: pytest backend/ --cov=backend --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-lint:
    name: Frontend — Lint & Types (ESLint + Prettier + tsc)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint — linting
        run: npm run lint
        working-directory: frontend

      - name: Prettier — format
        run: npx prettier --check "src/**/*.{ts,tsx}"
        working-directory: frontend

      - name: tsc — Check Types
        run: npx tsc --noEmit
        working-directory: frontend

  frontend-tests:
    name: Frontend — Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [changes,frontend-lint]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Vitest
        run: npm run test
        working-directory: frontend