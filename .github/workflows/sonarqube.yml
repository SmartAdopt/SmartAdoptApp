name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop
      - feature/sa-179-integrate-sonarqube-static-cod
  pull_request:
    branches:
      - main
      - develop
      - feature/sa-179-integrate-sonarqube-static-cod

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Deshabilita el shallow clone, necesario para un mejor análisis en SonarQube

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies and Run Tests
        working-directory: ./frontend
        run: |
          npm ci
          npm run test -- --coverage || true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies and Run Tests
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pytest --cov=app --cov-report=xml || true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://server2.distribuidauce.org"
